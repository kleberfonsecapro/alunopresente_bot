services:
  db:
    image: postgres:15-alpine
    container_name: aluno_presente_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-scraper_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/postgres:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scraper_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aluno_presente_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - playwright_session:/app/playwright_state
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aluno_presente_scheduler
    restart: unless-stopped
    command: python manage.py run_scheduler
    volumes:
      - ./backend:/app
      - playwright_session:/app/playwright_state
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aluno_presente_listener
    restart: unless-stopped
    command: python manage.py listen_telegram
    volumes:
      - ./backend:/app
      - playwright_session:/app/playwright_state
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: aluno_presente_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/frontend/static:/usr/share/nginx/html/static:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  playwright_session:
