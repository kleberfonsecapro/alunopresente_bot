<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sessão Encerrada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1e293b; border-radius: 12px; padding: 2.5rem; text-align: center; max-width: 420px; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #94a3b8; margin-bottom: 1.5rem; line-height: 1.5; }
        .btn { display: inline-block; padding: .75rem 1.5rem; background: #6366f1; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sessão Encerrada</h1>
        <p>Você saiu do Painel de Controle e do Admin Django.<br>Todas as sessões foram encerradas com segurança.</p>
        <a href="/login/" class="btn">Voltar ao Login</a>
    </div>
</body>
</html>
